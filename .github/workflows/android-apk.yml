name: Build SafeGate Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Validate Cloud Sync build secrets
        env:
          VITE_APP_INGEST_KEY: ${{ secrets.VITE_APP_INGEST_KEY }}
          VITE_EVENT_PROOF_HMAC_SECRET: ${{ secrets.VITE_EVENT_PROOF_HMAC_SECRET }}
        run: |
          if [ -z "$VITE_APP_INGEST_KEY" ] || [ -z "$VITE_EVENT_PROOF_HMAC_SECRET" ]; then
            echo "::error::Missing GitHub Secrets VITE_APP_INGEST_KEY or VITE_EVENT_PROOF_HMAC_SECRET in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies & verify security tests
        env:
          VITE_SAFEGATE_PLATFORM_URL: ${{ vars.VITE_SAFEGATE_PLATFORM_URL || 'https://api.pavanserver.me' }}
          VITE_SAFEGATE_APP_ID: ${{ vars.VITE_SAFEGATE_APP_ID || 'com.safegate.app' }}
          VITE_APP_INGEST_KEY: ${{ secrets.VITE_APP_INGEST_KEY }}
          VITE_EVENT_PROOF_HMAC_SECRET: ${{ secrets.VITE_EVENT_PROOF_HMAC_SECRET }}
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run lint
          npm run build

      - name: Sync Capacitor Android project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Accept Android SDK licenses & build Debug APK
        working-directory: android
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload SafeGate Debug APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: SafeGate-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
