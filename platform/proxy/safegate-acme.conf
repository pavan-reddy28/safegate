# SafeGate temporary ACME validation only
server {
    listen 80 default_server;
    server_name api.pavanserver.me;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    root /var/www/certbot;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
