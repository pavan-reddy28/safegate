# Included from nginx's http {} context.

limit_req_zone $binary_remote_addr zone=safegate_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=safegate_connections:10m;

limit_req_status 429;
limit_conn_status 429;

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    access_log off;
    error_log /dev/stderr crit;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $safegate_backend platform:4317;

    limit_conn safegate_connections 20;

    location = /health {
        if ($request_method != GET) { return 405; }
        limit_req zone=safegate_api burst=20 nodelay;
        proxy_pass http://$safegate_backend;
        include /etc/nginx/safegate-proxy-headers.inc;
    }

    location = /ready {
        if ($request_method != GET) { return 405; }
        limit_req zone=safegate_api burst=20 nodelay;
        proxy_pass http://$safegate_backend;
        include /etc/nginx/safegate-proxy-headers.inc;
    }

    location = /api/v1/events {
        if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
        limit_req zone=safegate_api burst=20 nodelay;
        proxy_pass http://$safegate_backend;
        include /etc/nginx/safegate-proxy-headers.inc;
    }

    location ~ "^/api/v1/app/events/[A-Za-z0-9][A-Za-z0-9._:-]{2,127}/decision$" {
        if ($request_method !~ ^(GET|OPTIONS)$) { return 405; }
        limit_req zone=safegate_api burst=20 nodelay;
        proxy_pass http://$safegate_backend;
        include /etc/nginx/safegate-proxy-headers.inc;
    }

    location ~ "^/api/v1/events/[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$" {
        if ($request_method !~ ^(GET|PATCH|DELETE|OPTIONS)$) { return 405; }
        limit_req zone=safegate_api burst=20 nodelay;
        proxy_pass http://$safegate_backend;
        include /etc/nginx/safegate-proxy-headers.inc;
    }

    location / {
        return 404;
    }
}
