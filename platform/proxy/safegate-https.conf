# SafeGate HTTPS reverse proxy
# Loaded inside nginx http context.

limit_req_zone $binary_remote_addr zone=safegate_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=safegate_connections:10m;
limit_req_status 429;
limit_conn_status 429;

# HTTP: ACME validation only; all other requests redirect to HTTPS.
server {
    listen 80 default_server;
    server_name api.pavanserver.me;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    root /var/www/certbot;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://api.pavanserver.me$request_uri;
    }
}

# HTTPS: SafeGate Two-Plane API.
server {
    listen 443 ssl default_server;
    server_name api.pavanserver.me;
    server_tokens off;

    ssl_certificate /run/secrets/safegate_api_fullchain_v1;
    ssl_certificate_key /run/secrets/safegate_api_privkey_v1;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    access_log off;
    error_log /dev/stderr crit;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $safegate_backend platform:4317;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=safegate_api burst=20 nodelay;
    limit_conn safegate_connections 20;

    include /etc/nginx/safegate-proxy-headers.inc;

    location = /health {
        if ($request_method != GET) { return 405; }
        proxy_pass http://$safegate_backend;
    }
    location = /ready {
        if ($request_method != GET) { return 405; }
        proxy_pass http://$safegate_backend;
    }
    location = /api/v1/events {
        if ($request_method !~ ^(GET|POST)$) { return 405; }
        proxy_pass http://$safegate_backend;
    }
    location ~ "^/api/v1/events/[A-Za-z0-9][A-Za-z0-9._:-]{2,127}$" {
        if ($request_method !~ ^(GET|PATCH|DELETE)$) { return 405; }
        proxy_pass http://$safegate_backend;
    }
    location / {
        return 404;
    }
}
