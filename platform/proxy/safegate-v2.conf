# SafeGate HTTPS reverse proxy
# Loaded inside nginx http context.

limit_req_zone $binary_remote_addr zone=safegate_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=safegate_web:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=safegate_connections:10m;
limit_req_status 429;
limit_conn_status 429;

# Privacy-preserving request audit.
# No client IP, user-agent, referrer or query-string values.
log_format safegate_audit escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"duration_seconds":$request_time,'
    '"upstream_status":"$upstream_status"}';


# HTTP (API): ACME validation only; all other requests redirect to HTTPS.
server {
    listen 80 default_server;
    server_name api.pavanserver.me;

    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;

    root /var/www/certbot;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://api.pavanserver.me$request_uri;
    }
}


# HTTP (Dashboard): ACME validation only; all other requests redirect to HTTPS.
server {
    listen 80;
    server_name pavanserver.me www.pavanserver.me;

    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;

    root /var/www/certbot;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://pavanserver.me$request_uri;
    }
}


# HTTPS: SafeGate Two-Plane API (App POST ingest + Key Vault GET/PATCH/DELETE).
server {
    listen 443 ssl default_server;
    server_name api.pavanserver.me;

    server_tokens off;

    ssl_certificate /run/secrets/safegate_api_fullchain_v1;
    ssl_certificate_key /run/secrets/safegate_api_privkey_v1;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    access_log /dev/stdout safegate_audit;
    error_log /dev/stderr crit;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $safegate_backend platform:4317;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=safegate_api burst=20 nodelay;
    limit_conn safegate_connections 20;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;

    location = /health {
        if ($request_method != GET) { return 405; }
        proxy_pass http://$safegate_backend;
    }

    location = /ready {
        if ($request_method != GET) { return 405; }
        proxy_pass http://$safegate_backend;
    }

    location = /api/v1 {
        proxy_pass http://$safegate_backend;
    }

    location ^~ /api/v1/ {
        proxy_pass http://$safegate_backend;
    }

    location / {
        return 404;
    }
}


# HTTPS: SafeGate Control Operator Dashboard (React SPA + Dual-Layer Auth BFF).
server {
    listen 443 ssl;
    server_name pavanserver.me www.pavanserver.me;

    server_tokens off;

    ssl_certificate /run/secrets/safegate_web_fullchain_v1;
    ssl_certificate_key /run/secrets/safegate_web_privkey_v1;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;

    access_log /dev/stdout safegate_audit;
    error_log /dev/stderr crit;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $safegate_dashboard dashboard:4318;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=safegate_web burst=60 nodelay;
    limit_conn safegate_connections 30;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID "";
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;

    location / {
        proxy_pass http://$safegate_dashboard;
    }
}
